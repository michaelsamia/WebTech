<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me</title>
</head>
<body>

    <header>
        <h1>Contact Me</h1>
    </header>

    <nav>
        <a href="index.html">HOME</a> | 
        <a href="about.html">ABOUT</a> | 
        <a href="education.html">EDUCATION</a> | 
        <a href="skills.html">SKILLS</a> | 
        <a href="contact.html">CONTACT</a>
    </nav>

    <main>
        <section>
            <article>
                <h2>Get In Touch</h2>
                <p>If you want to discuss web development or collaborate on a project, send me a message!</p>

                <form action="">
                    <label>Name:</label>
                    <br>
                    <input type="text" placeholder="Your full name" required>
                    <br><br>
                    
                    <label>Student ID (Optional):</label>
                    <br>
                    <input type="text" placeholder="e.g. 25-6626-254">
                    <br><br>

                    <label>Email:</label>
                    <br>
                    <input type="email" placeholder="example@email.com" required>
                    <br><br>

                    <label>Message:</label>
                    <br>
                    <textarea rows="5" cols="40" placeholder="Type your message here..." required></textarea>
                    <br><br>

                    <button type="submit">Send Message</button>
                    <button type="reset">Clear Form</button>
                </form>
            </article>
        </section>
    </main>

    <footer>
        <p>Created by Michael Jarred K. Samia</p>
    </footer>

</body>
</html>
