<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Schedule</title>
</head>
<body>

    <h1>Lab Activity 6: HTML Tables</h1>

    <h2>My Weekly Class Schedule</h2>

    <table border="1">
        <tr>
            <th>Day</th>
            <th>Time</th>
            <th>Subject</th>
            <th>Room</th>
            <th>Instructor</th>
        </tr>
        <tr>
            <td rowspan="2">Monday</td>
            <td>8:00 AM</td>
            <td>Web Development</td>
            <td>LAB 1</td>
            <td>Instructor A</td>
        </tr>
        <tr>
            <td>10:00 AM</td>
            <td>Database Systems</td>
            <td>LAB 2</td>
            <td>Instructor B</td>
        </tr>
        <tr>
            <td colspan="5" align="center">LUNCH BREAK</td>
        </tr>
        <tr>
            <td>Tuesday</td>
            <td>1:00 PM</td>
            <td>Networking</td>
            <td>Room 304</td>
            <td>Instructor C</td>
        </tr>
    </table>

</body>
</html>
