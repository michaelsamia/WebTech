<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimedia</title>
</head>
<body>

    <h1>Lab Activity 9: Multimedia</h1>

    <h2>1. Image</h2>
    <img src="images/profile.jpg" alt="Profile Picture" width="200">
    <br><br>

    <h2>2. Audio with Controls</h2>
    <audio controls>
        <source src="media/audio.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>
    <br><br>

    <h2>3. Video with Controls</h2>
    <video controls width="300">
        <source src="media/video.mp4" type="video/mp4">
        Your browser does not support the video element.
    </video>
    <br><br>

    <h2>4. Embedded Educational Video</h2>
    <iframe width="400" height="250" src="https://www.youtube.com/embed/qz0aGYrrlhU" title="HTML Tutorial" frameborder="0" allowfullscreen></iframe>

</body>
</html>
