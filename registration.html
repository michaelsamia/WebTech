<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>

    <h1>Lab Activity 7: HTML Forms</h1>
    
    <h2>Student Registration Form</h2>

    <form action="">
        
        <label>Full Name:</label>
        <input type="text" placeholder="Enter your full name" required>
        <br><br>

        <label>Student ID:</label>
        <input type="text" placeholder="Your student ID" maxlength="15" required>
        <br><br>

        <label>Email:</label>
        <input type="email" placeholder="example@email.com" required>
        <br><br>

        <label>Password:</label>
        <input type="password" minlength="8" required>
        <br><br>

        <label>Birthday:</label>
        <input type="date" required>
        <br><br>

        <label>Gender:</label>
        <input type="radio" name="gender" value="Male" required> Male
        <input type="radio" name="gender" value="Female"> Female
        <br><br>

        <label>Program:</label>
        <select required>
            <option value="">Select your program</option>
            <option value="BSIT">BSIT</option>
            <option value="BSCS">BSCS</option>
            <option value="BSMA">BSMA</option>
        </select>
        <br><br>

        <label>Hobbies:</label>
        <input type="checkbox" value="Programming"> Programming
        <input type="checkbox" value="Gaming"> Gaming
        <input type="checkbox" value="Skating"> Skating
        <br><br>

        <label>Address:</label>
        <input type="text" placeholder="Enter your address" required>
        <br><br>

        <label>Comments:</label>
        <br>
        <textarea rows="4" cols="30" placeholder="Type your comments here..."></textarea>
        <br><br>

        <button type="submit">Submit</button>
        <button type="reset">Reset</button>

    </form>

</body>
</html>
