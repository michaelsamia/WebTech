<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>

    <h1>Student Registration Form</h1>

    <form action="">
        <div>
            <label>Student ID:</label><br>
            <input type="text" placeholder="e.g. 25-6626-254" required>
        </div>
        <br>
        <div>
            <label>Full Name:</label><br>
            <input type="text" placeholder="Enter your full name" required>
        </div>
        <br>
        <div>
            <label>Email:</label><br>
            <input type="email" placeholder="Enter your email" required>
        </div>
        <br>
        <div>
            <label>Password:</label><br>
            <input type="password" required>
        </div>
        <br>
        <div>
            <label>Gender:</label><br>
            <input type="radio" name="gender" value="male"> Male
            <input type="radio" name="gender" value="female"> Female
        </div>
        <br>
        <div>
            <label>Course:</label><br>
            <input type="text" value="BSIT - Web Technology" required>
        </div>
        <br>
        <div>
            <label>Hobbies:</label><br>
            <input type="checkbox" name="hobby" value="skating"> Inline Skating
            <input type="checkbox" name="hobby" value="gaming"> Gaming
        </div>
        <br>
        <div>
            <label>Address:</label><br>
            <textarea rows="4" cols="30" placeholder="Enter your address"></textarea>
        </div>
        <br>
        <div>
            <button type="submit">Submit Registration</button>
        </div>
    </form>

</body>
</html>
